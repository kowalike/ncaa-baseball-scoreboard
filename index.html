<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NCAA D1 Baseball Scoreboard</title>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --text: #e6e6e6;
      --muted: #9aa0a6;
      --accent: #1f6feb;
      --divider: #2a2a2a;
      --winner-bg: #ffd900;
      --chip-bg: #1a1a1a;
      --chip-active: #222d3b;
      --hl: #fff2a8;   /* search highlight */
      --fav-color: #ffd700; /* gold for favorite star */
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--divider);
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
    }
    header .title {
      font-weight: 600;
      font-size: 1.15rem;
      white-space: nowrap;
    }
    header .actions {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 8px;
      align-items: center;
      width: 100%;
      max-width: 620px;
    }
    header .actions input[type="search"],
  header .actions select,
  header .actions input[type="date"]:not(.date-icon-input),
  header .actions button {
      background: var(--chip-bg);
      border: 1px solid var(--divider);
      color: var(--text);
      padding: 8px 10px;
      font-size: 0.95rem;
      border-radius: 8px;
    }
    header .actions input[type="search"]::placeholder {
      color: var(--muted);
    }
    header .actions button:hover { background: var(--chip-active); cursor: pointer; }

  header .actions select {
    min-width: 180px;
  }

  /* Icon-only date picker (mobile-friendly). The real input sits above the icon. */
  .date-icon-wrap {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    height: 38px;
  }
  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
  text-align: center;
    width: 42px;
    height: 38px;
    padding: 0;
    font-size: 1.1rem;
    line-height: 1;
    background: var(--chip-bg);
    border: 1px solid var(--divider);
    color: var(--text);
    border-radius: 8px;
    user-select: none;
  }
  .date-icon-wrap:hover .icon-btn { background: var(--chip-active); }

  /* iOS/Safari can ignore clicks on fully transparent inputs; use tiny opacity + z-index */
  .date-icon-input {
    position: absolute;
    inset: 0;
    opacity: 0;
    pointer-events: none;
  }

    /* Date chips */
    .date-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 16px;
      border-bottom: 1px solid var(--divider);
      background: var(--bg);
    }
    .date-chip {
      flex: 0 0 auto;
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--chip-bg);
      color: var(--text);
      border: 1px solid var(--divider);
      user-select: none;
      white-space: nowrap;
      font-size: 0.95rem;
    }
    .date-chip.active {
      background: var(--chip-active);
      border-color: var(--accent);
      color: #eaf2ff;
    }
    .date-chip:hover { cursor: pointer; }

    /* Section header */
    .section-header {
      display: flex;
      justify-content: center;
      padding: 12px 16px 4px;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .section-header a {
      color: var(--muted);
      text-decoration: none;
      font-weight: 500;
    }
    .section-header a:hover { color: var(--text); }

    /* Game list */
    .games {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .game {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--divider);
      background: var(--card);
    }
    .teams {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .team-row {
      display: grid;
      grid-template-columns: 28px 1fr auto auto; /* logo, name, favorite button, score */
      align-items: center;
      gap: 10px;
    }
    .team-row img.logo {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      background: #ffffff;
    }
    .team-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.98rem;
    }
    .team-name mark {
      background: var(--hl);
      color: #000;
      padding: 0 2px;
      border-radius: 3px;
    }
    .fav-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.2rem;
      cursor: pointer;
      transition: color 0.2s;
      padding: 0 4px;
      line-height: 1;
    }
    .fav-btn:hover { color: var(--fav-color); }
    .fav-btn.active { color: var(--fav-color); }

    .team-score {
      padding: 2px 8px;
      border-radius: 6px;
      background: transparent;
      font-variant-numeric: tabular-nums;
      min-width: 36px;
      text-align: center;
    }
    .team-score.winner {
      background: var(--winner-bg);
      color: #000;
      font-weight: 700;
    }

    .game-meta {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      color: var(--muted);
      font-size: 0.95rem;
      gap: 8px;
    }

    .info {
      padding: 16px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* Favorite section */
    h3.favorite-header {
      padding: 12px 16px 0;
      margin: 0;
      font-size: 1.05rem;
      color: var(--fav-color);
    }
    .favorite-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px 12px;
    }
    
 .favorite-team-list {
   color: var(--muted);
   font-size: 0.9rem;
   overflow: hidden;
   text-overflow: ellipsis;
   white-space: nowrap;
 }
.clear-fav-btn {
      background: var(--chip-bg);
      border: 1px solid var(--divider);
      color: var(--text);
      padding: 6px 10px;
      font-size: 0.9rem;
      border-radius: 6px;
      cursor: pointer;
    }
    .clear-fav-btn:hover { background: var(--chip-active); }

    /* Container */
    @media (min-width: 900px) {
      .container {
        max-width: 820px;
        margin: 0 auto;
        border-left: 1px solid var(--divider);
        border-right: 1px solid var(--divider);
        background: var(--bg);
      }
    }
  

/* Responsive header controls */
@media (max-width: 640px) {
  header { flex-direction: column; align-items: stretch; }
  header .title { width: 100%; }
  header .actions { width: 100%; max-width: none; grid-template-columns: 1fr; }
  header .actions input[type="search"],
  header .actions select,
  header .actions button { width: 100%; }

  .date-icon-wrap { width: 100%; }
  .icon-btn { width: 100%; }
  .date-icon-input { width: 100%; }

  header .actions select { min-width: 0; }
}
  .game-meta .boxscore-link {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }
  .game-meta .boxscore-link:hover { text-decoration: underline; }

</style>

const CONF_SELECT_STORAGE_KEY = 'selectedConference';
let selectedConference = localStorage.getItem(CONF_SELECT_STORAGE_KEY) || '';

function normalizeTeamName(name) {
  return String(name || '')
    .toLowerCase()
    .replace(/&/g, 'and')
    .replace(/’/g, "'")
    .replace(/[^a-z0-9 ]/g, ' ')
    .replace(/st/g, 'saint')
    .replace(/\s+/g, ' ')
    .trim();
}

const CONFERENCE_TEAM_SETS = Object.fromEntries(
  Object.entries(CONFERENCE_TEAMS).map(([conf, teams]) => [
    conf,
    new Set((teams || []).map(normalizeTeamName))
  ])
);

function eventInSelectedConference(ev) {
 if (!selectedConference) return true;

 // Special filter: Top 25 (only games featuring at least one ranked team)
 if (selectedConference === '__TOP25__') {
   const comp = ev?.competitions?.[0] || {};
   const competitors = comp?.competitors || [];
   // curatedRank is absent for unranked teams
   return competitors.some(c => Number.isFinite(Number(c?.curatedRank?.current)));
 }
  const set = CONFERENCE_TEAM_SETS[selectedConference];
  if (!set) return true;
  const comp = ev?.competitions?.[0] || {};
  const competitors = comp?.competitors || [];
  const away = teamObj(competitors, 'away');
  const home = teamObj(competitors, 'home');
  const a = normalizeTeamName(away?.name);
  const h = normalizeTeamName(home?.name);
  return set.has(a) || set.has(h);
}

function filterEvents(events, q) {
  const needle = (q || '').toLowerCase();
  return (events || []).filter(ev => {
    if (!eventInSelectedConference(ev)) return false;
    if (!needle) return true;
    const comp = ev?.competitions?.[0] || {};
    const competitors = comp?.competitors || [];
    const away = teamObj(competitors, 'away');
    const home = teamObj(competitors, 'home');
    const a = away?.name?.toLowerCase() || '';
    const h = home?.name?.toLowerCase() || '';
    return a.includes(needle) || h.includes(needle);
  });
}

// --- Date helpers ---
    function toYYYYMMDD(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}${m}${d}`;
    }
    function toISODateInputValue(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }
    function fromISODateInputValue(str) {
      const [y, m, d] = str.split("-").map(Number);
      return new Date(y, m - 1, d);
    }
    function labelForChip(date, today) {
      const sameDay = date.toDateString() === today.toDateString();
      if (sameDay) return "TODAY";
      const months = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
      return `${months[date.getMonth()]} ${date.getDate()}`;
    }
    function toOrdinal(n) {
      if (!Number.isFinite(n)) return "";
      const s = ["th", "st", "nd", "rd"], v = n % 100;
      return n + (s[(v - 20) % 10] || s[v] || s[0]);
    }

    // --- Date strip ---
    function renderDateStrip(selectedDate) {
      dateStrip.innerHTML = "";
      const today = new Date();
      for (let offset = -3; offset <= 3; offset++) {
        const d = new Date(selectedDate);
        d.setDate(d.getDate() + offset);
        const chip = document.createElement("button");
        chip.className = "date-chip" + (d.toDateString() === selectedDate.toDateString() ? " active" : "");
        chip.textContent = labelForChip(d, today);
        chip.title = d.toDateString();
        chip.addEventListener("click", () => {
          datePicker.value = toISODateInputValue(d);
          updateScores(d);
        });
        dateStrip.appendChild(chip);
      }
    }

    // --- API fetch ---
async function fetchScores(date) {
  // LOSSLESS fetch: keep the API response intact (no filtering/slicing here)
  const url = `${API_BASE}?dates=${toYYYYMMDD(date)}&limit=1000`;
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const json = await res.json();
  return json;
}
    async function fetchAndWriteScoreboard(dateYYYYMMDD) {
      const baseUrl =
        "https://site.api.espn.com/apis/site/v2/sports/baseball/college-baseball/scoreboard";
    
      const url = `${baseUrl}?dates=${dateYYYYMMDD}`;
    
      const response = await fetch(url);
    
      if (!response.ok) {
        throw new Error(`Scoreboard fetch failed: ${response.status}`);
      }
    
      // Parse JSON ONCE
      const apiData = await response.json();
    
      // Sanity check (optional but recommended)
      if (!apiData || !Array.isArray(apiData.events)) {
        throw new Error("Invalid ESPN scoreboard response");
      }
    
      // LOSSLESS WRITE
      // Do NOT modify apiData in any way
      const jsonText = JSON.stringify(apiData, null, 2);
    
      // Browser
      if (typeof window !== "undefined") {
        const blob = new Blob([jsonText], { type: "application/json" });
        const url = URL.createObjectURL(blob);
    
        const a = document.createElement("a");
        a.href = url;
        a.download = `scoreboard-${dateYYYYMMDD}.json`;
        a.click();
    
        URL.revokeObjectURL(url);
      }
    
      // Node.js
      if (typeof require !== "undefined") {
        const fs = require("fs");
        fs.writeFileSync(
          `scoreboard-${dateYYYYMMDD}.json`,
          jsonText,
          "utf8"
        );
      }
    
      return apiData; // return raw data for debugging if needed
    }

    // --- Data helpers ---
    function teamObj(competitors, side) {
 const c = competitors.find(c => (c.homeAway || "").toLowerCase() === side);
 if (!c) return null;
 const score = Number.isFinite(Number(c.score)) ? Number(c.score) : null;
 const team = c.team || {};

 // Base name (used for favorites, filtering, comparisons, etc.)
 const name = team.location || team.displayName || "Unknown";

 // Top 25 rank from JSON (absent for unranked teams)
 const rank = Number.isFinite(Number(c?.curatedRank?.current))
   ? Number(c.curatedRank.current)
   : null;

 // Display name (used only for UI rendering)
 const displayName = rank ? `#${rank} ${name}` : name;

 return {
   name,
   displayName,
   rank,
   logo: team.logo || "",
   score
 };
 }
function statusTextFrom(comp) {
      const st = comp?.status || {};
      const type = st?.type || {};
      const state = (type?.state || "").toLowerCase(); // pre | in | post
      const shortDetail = type?.shortDetail || "";      // "Top 5th", "Final", "6:00 PM"
      const period = st?.period;

      if (state === "in") {
        if (/\b(top|bottom)\b/i.test(shortDetail)) return shortDetail;
        if (Number.isFinite(period)) return `In Progress · ${toOrdinal(period)}`;
        return type?.description || "In Progress";
      }
      if (state === "pre") return shortDetail || "Scheduled";
      if (state === "post") return shortDetail || "Final";
      return shortDetail || type?.description || "TBD";
    }

    // --- Search highlight ---
    function escapeHTML(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}
function highlightMatch(name, q) {
      if (!q) return escapeHTML(name);
      const lower = name.toLowerCase();
      const idx = lower.indexOf(q);
      if (idx === -1) return escapeHTML(name);
      const before = name.slice(0, idx);
      const middle = name.slice(idx, idx + q.length);
      const after = name.slice(idx + q.length);
      return `${escapeHTML(before)}<mark>${escapeHTML(middle)}</mark>${escapeHTML(after)}`;
    }

    // --- Favorites handling (up to 20) ---
function saveFavorites(){
  if (!favoriteTeams || favoriteTeams.length === 0) {
    localStorage.removeItem(FAVORITES_STORAGE_KEY);
  } else {
    localStorage.setItem(FAVORITES_STORAGE_KEY, JSON.stringify(favoriteTeams));
  }
}
function isFavorite(teamName){
  return Array.isArray(favoriteTeams) && favoriteTeams.includes(teamName);
}
function toast(msg, ms=2500){
  // lightweight, non-blocking notice in the info area
  if (!info) return;
  const prev = info.textContent;
  info.textContent = msg;
  setTimeout(()=>{ if (info.textContent === msg) info.textContent = prev || ''; }, ms);
}
function toggleFavorite(teamName){
  if (!teamName) return;
  const idx = favoriteTeams.indexOf(teamName);
  if (idx >= 0) {
    favoriteTeams.splice(idx, 1);
    saveFavorites();
    renderGames(lastEvents);
    return;
  }
  if (favoriteTeams.length >= MAX_FAVORITES) {
    toast(`You can favorite up to ${MAX_FAVORITES} teams. Remove one to add another.`);
    return;
  }
  favoriteTeams.push(teamName);
  saveFavorites();
  renderGames(lastEvents);
}
function clearFavorites(){
  favoriteTeams = [];
  saveFavorites();
  renderGames(lastEvents);
}
// --- Render one game ---
    function renderGame(event) {
      const comp = event?.competitions?.[0] || {};
      const competitors = comp?.competitors || [];
      const away = teamObj(competitors, "away");
      const home = teamObj(competitors, "home");
      if (!away || !home) return null;

      const statusText = statusTextFrom(comp);
      const scoresAreNumbers = Number.isFinite(away.score) && Number.isFinite(home.score);
      const awayWin = scoresAreNumbers && away.score > home.score;
      const homeWin = scoresAreNumbers && home.score > away.score;

      const li = document.createElement("li");
      li.className = "game";

      const teamsBlock = document.createElement("div");
      teamsBlock.className = "teams";

      // Build team rows (away then home)
      [away, home].forEach(team => {
        const row = document.createElement("div");
        row.className = "team-row";

        const logo = document.createElement("img");
        logo.className = "logo";
        logo.src = team.logo || "";
        logo.alt = `${team.name} logo`;

        const nameSpan = document.createElement("span");
        nameSpan.className = "team-name";
        nameSpan.innerHTML = highlightMatch(team.displayName || team.name, searchTerm);

        const favBtn = document.createElement("button");
const favActive = isFavorite(team.name);
favBtn.className = "fav-btn" + (favActive ? " active" : "");
favBtn.textContent = "★";
favBtn.title = favActive ? "Remove from Favorites" : `Add to Favorites (${favoriteTeams.length}/${MAX_FAVORITES})`;
favBtn.setAttribute('aria-pressed', favActive ? 'true' : 'false');
favBtn.addEventListener("click", () => toggleFavorite(team.name));

        const scoreSpan = document.createElement("span");
        const isWinner = (team === away && awayWin) || (team === home && homeWin);
        scoreSpan.className = "team-score" + (isWinner ? " winner" : "");
        scoreSpan.textContent = Number.isFinite(team.score) ? String(team.score) : "";

        row.appendChild(logo);
        row.appendChild(nameSpan);
        row.appendChild(favBtn);
        row.appendChild(scoreSpan);

        teamsBlock.appendChild(row);
      });

      const meta = document.createElement("div");
 meta.className = "game-meta";
 // Status text + (today only) boxscore link for the home team
 const st = comp?.status || {};
 const type = st?.type || {};
 const state = (type?.state || "").toLowerCase();
 const statusSpan = document.createElement("span");
 statusSpan.textContent = statusText;
 meta.appendChild(statusSpan);
 // Only show boxscore links for games on the current day
 const isToday = (currentSelectedDate && currentSelectedDate.toDateString() === new Date().toDateString());
 if (isToday && (state === "in" || state === "post")) {
   const boxUrl = TEAM_BOX_URLS[normalizeTeamName(home?.name)];
   if (boxUrl) {
     const sep = document.createElement("span");
     sep.textContent = "·";
     const a = document.createElement("a");
     a.className = "boxscore-link";
     a.href = boxUrl;
    // Opens in the same window for accessibility best practices
     a.rel = "noopener";
     a.textContent = (state === "in") ? "Live Boxscore" : "Final Boxscore";
     meta.appendChild(sep);
     meta.appendChild(a);
   }
 }

      li.appendChild(teamsBlock);
      li.appendChild(meta);

      return li;
    }

    // --- Filtering ---
    function filterEventsBySearch(events, q) {
      if (!q) return events;
      const needle = q.toLowerCase();
      return events.filter(ev => {
        const comp = ev?.competitions?.[0] || {};
        const competitors = comp?.competitors || [];
        const away = teamObj(competitors, "away");
        const home = teamObj(competitors, "home");
        const a = away?.name?.toLowerCase() || "";
        const h = home?.name?.toLowerCase() || "";
        return a.includes(needle) || h.includes(needle);
      });
    }

    // --- Render list ---
    function renderGames(events) {
      gamesList.innerHTML = "";
      const filtered = filterEvents(events, searchTerm);

      if (!filtered.length) {
        info.textContent = searchTerm
          ? `No games found matching “${searchTerm}”.`
          : "No games found for this date.";
        return;
      }
      info.textContent = "";

      // Favorites section (show games containing any favorited team)
let shownFavoriteIds = new Set();
if (Array.isArray(favoriteTeams) && favoriteTeams.length) {
  const favoriteGames = filtered.filter(ev => {
    const comp = ev?.competitions?.[0] || {};
    const competitors = comp?.competitors || [];
    const away = teamObj(competitors, 'away');
    const home = teamObj(competitors, 'home');
    return isFavorite(away?.name) || isFavorite(home?.name);
  });
  if (favoriteGames.length) {
    const favHeader = document.createElement('h3');
    favHeader.className = 'favorite-header';
    favHeader.textContent = `Favorites (${favoriteTeams.length}/${MAX_FAVORITES})`;
    gamesList.appendChild(favHeader);

    const favActions = document.createElement('div');
    favActions.className = 'favorite-actions';

    const clearBtn = document.createElement('button');
    clearBtn.className = 'clear-fav-btn';
    clearBtn.textContent = 'Clear Favorites';
    clearBtn.addEventListener('click', clearFavorites);
    favActions.appendChild(clearBtn);

    const listSpan = document.createElement('span');
    listSpan.className = 'favorite-team-list';
    listSpan.textContent = favoriteTeams.join(', ');
    favActions.appendChild(listSpan);

    gamesList.appendChild(favActions);

    favoriteGames.forEach(ev => {
      const node = renderGame(ev);
      if (node) gamesList.appendChild(node);
      if (ev?.id) shownFavoriteIds.add(String(ev.id));
    });
  }
}
// Remaining games (skip those already shown in Favorites section)
      filtered.forEach(ev => {
        const comp = ev?.competitions?.[0] || {};
        const competitors = comp?.competitors || [];
        const away = teamObj(competitors, "away");
        const home = teamObj(competitors, "home");
        if (shownFavoriteIds.has(String(ev?.id || ''))) return;
        const node = renderGame(ev);
        if (node) gamesList.appendChild(node);
      });
    }

    // --- Update flow ---
    async function updateScores(date) {
 currentSelectedDate = date;
      info.textContent = "Loading scores…";
      renderDateStrip(date);
      try {
        const scoreboard = await fetchScores(date);
  const events = Array.isArray(scoreboard?.events) ? scoreboard.events : [];
  lastEvents = events.slice();
        renderGames(lastEvents);
        info.textContent = "";
      } catch (err) {
        console.error(err);
        info.textContent = "Failed to load scores. If this persists, try running from a local web server due to CORS.";
      }
    }

    // --- Debounce ---
    function debounce(fn, wait = 200) {
      let t = null;
      return (...args) => {
        clearTimeout(t);
        t = setTimeout(() => fn(...args), wait);
      };
    }

    // --- Init ---
    (function init() {

  // Date picker: update scores when a new date is selected
  if (datePicker) {
    datePicker.addEventListener('change', () => {
      const date = fromISODateInputValue(datePicker.value);
      updateScores(date);
    });
  }
  
  const dateIconBtn = document.getElementById("dateIconBtn");
  
  dateIconBtn.addEventListener("click", () => {

    } else {

    }

  // Populate conference dropdown (and restore last selection)
  (function initConferenceSelect() {

    optAll.textContent = 'All conferences';
    confSelect.appendChild(optAll);

 const optTop25 = document.createElement('option');
 optTop25.value = '__TOP25__';
 optTop25.textContent = 'Top 25';
 confSelect.appendChild(optTop25);

      .sort((a,b)=>a.localeCompare(b))

    if (selectedConference && selectedConference !== '__TOP25__' && !CONFERENCE_TEAMS[selectedConference]) {

    confSelect.addEventListener('change', (e) => {

        localStorage.removeItem(CONF_SELECT_STORAGE_KEY);
      }

  })();

      const now = new Date();
      datePicker.value = toISODateInputValue(now);

      getScoresBtn.addEventListener("click", () => {
        const date = fromISODateInputValue(datePicker.value);
        updateScores(date);
      });

      teamSearch.addEventListener("input", debounce((e) => {
        searchTerm = (e.target.value || "").trim().toLowerCase();
        renderGames(lastEvents);
      }, 150));

      // Prevent Enter in search from triggering a form submit
      teamSearch.addEventListener("keydown", (e) => {
        if (e.key === "Enter") e.preventDefault();
      });
 // Initial load
      updateScores(now);
    })();
